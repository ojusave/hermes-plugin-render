[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-render"
version = "0.1.0a1"
description = "Render Sandboxes execution provider for Hermes Agent"
requires-python = ">=3.14,<3.15"
dependencies = ["render>=1.2.0,<1.3"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_render"]

[dependency-groups]
dev = ["hermes-agent", "pytest>=9.0.3,<10", "ruff>=0.15,<1", "build>=1.4,<2"]

[tool.uv.sources]
hermes-agent = { path = "../hermes-agent-reference", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: creates temporary paid Render Sandboxes"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
